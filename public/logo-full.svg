<svg viewBox="0 0 540 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cloud Body Gradient -->
    <linearGradient id="wgFullCloudGrad" x1="40" y1="35" x2="110" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#0C4A6E" />
    </linearGradient>

    <!-- AI Intelligence Sun Sparkle Gradient -->
    <linearGradient id="wgFullSparkleGrad" x1="90" y1="20" x2="116" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="30%" stopColor="#FDE047" />
      <stop offset="70%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <!-- Sun Sparkle -->
    <circle cx="106" cy="38" r="18" fill="#F59E0B" opacity="0.15" />
    <path d="M 106 24 Q 106 38 120 38 Q 106 38 106 52 Q 106 38 92 38 Q 106 38 106 24 Z" fill="url(#wgFullSparkleGrad)" />
    <circle cx="106" cy="38" r="2.5" fill="#FFFFFF" />

    <!-- Cloud Body -->
    <path
      d="M 40 96
         H 96
         A 12 12 0 0 0 108 84
         A 15 15 0 0 0 96 61
         A 22 22 0 0 0 62 52
         A 18 18 0 0 0 36 74
         A 12 12 0 0 0 40 96
         Z"
      fill="url(#wgFullCloudGrad)"
    />

    <!-- Cloud Highlight -->
    <path
      d="M 38 73 A 18 18 0 0 1 62 53 A 22 22 0 0 1 95 62"
      stroke="#FFFFFF"
      strokeWidth="2"
      strokeLinecap="round"
      opacity="0.75"
    />

    <!-- Synoptic Node Network -->
    <path d="M 48 80 L 70 73 L 92 80" stroke="#E0F2FE" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
    <line x1="70" y1="73" x2="84" y2="60" stroke="#FDE047" strokeWidth="1.5" strokeDasharray="2 2" />
    <circle cx="48" cy="80" r="3.5" fill="#FFFFFF" stroke="#0284C7" strokeWidth="1.2" />
    <circle cx="70" cy="73" r="4" fill="#FFFFFF" stroke="#0284C7" strokeWidth="1.2" />
    <circle cx="92" cy="80" r="3.5" fill="#FFFFFF" stroke="#0284C7" strokeWidth="1.2" />
    <circle cx="84" cy="60" r="3" fill="#FDE047" stroke="#D97706" strokeWidth="1" />
  </g>

  <!-- Typography -->
  <text x="160" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em" fill="#0F172A">
    Weather<tspan fill="#0284C7">GPT</tspan>
  </text>
  <text x="162" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.18em" fill="#64748B">
    ATMOSPHERIC INTELLIGENCE
  </text>
</svg>
